name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Build and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Runtime dependencies only. The build and audit scripts use nothing
      # beyond Node's stdlib, so devDependencies (sharp, esbuild, netlify-cli)
      # are not needed here.
      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Prepare publish directory
        run: npm run build

      - name: Verify serverless bundle isolation
        run: npm run verify:bundle

      - name: Start server
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server responding after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s"
          cat server.log
          exit 1

      - name: Audit SEO and word count
        run: npm run check

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
